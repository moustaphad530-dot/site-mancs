# ============================================================
# Configuration de l'éditeur de contenu (Decap CMS)
# ============================================================

backend:
  name: git-gateway
  repo: moustaphad530-dot/site-mancs
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/4cbb053a-85bf-4696-bd5f-592dc2c4d70e/pkce
  auth_token_endpoint: /sites/4cbb053a-85bf-4696-bd5f-592dc2c4d70e/token
  gateway_url: https://gateway.decapbridge.com

media_folder: "images"
public_folder: "/images"

collections:
  - name: "team"
    label: "Équipe"
    files:
      - name: "entries"
        label: "Membres"
        file: "content/team.json"
        fields:
          - { name: entries, label: "Membres", widget: list, fields: [
              { name: id, label: "Identifiant (unique, sans espace)", widget: string },
              { name: name, label: "Nom", widget: string },
              { name: role, label: "Rôle", widget: string },
              { name: field, label: "Domaine de recherche", widget: string },
              { name: bio, label: "Bio courte", widget: text },
              { name: email, label: "E-mail", widget: string },
              { name: photo, label: "Photo (optionnel — sinon, initiales affichées automatiquement)", widget: file, required: false, media_folder: "/images/team", public_folder: "/images/team" },
            ]}

  - name: "publications"
    label: "Publications"
    files:
      - name: "entries"
        label: "Publications"
        file: "content/publications.json"
        fields:
          - { name: entries, label: "Publications", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: year, label: "Année", widget: number, value_type: int },
              { name: title, label: "Titre", widget: string },
              { name: authors, label: "Auteurs", widget: string },
              { name: venue, label: "Revue / conférence", widget: string },
              { name: link, label: "PDF de la publication", widget: file, required: false, media_folder: "/files", public_folder: "/files", hint: "Cliquez pour choisir un fichier PDF depuis votre ordinateur" },
              { name: tags, label: "Mots-clés", widget: list, required: false },
            ]}

  - name: "projects"
    label: "Projets"
    files:
      - name: "entries"
        label: "Projets"
        file: "content/projects.json"
        fields:
          - { name: entries, label: "Projets", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: title, label: "Titre du projet", widget: string },
              { name: status, label: "Statut", widget: select, options: ["active", "completed"] },
              { name: summary, label: "Résumé", widget: text },
              { name: lead, label: "Responsable", widget: string },
              { name: tags, label: "Mots-clés", widget: list, required: false },
              { name: link, label: "Lien", widget: string, required: false },
            ]}

  - name: "seminaires"
    label: "Séminaires"
    files:
      - name: "entries"
        label: "Séminaires"
        file: "content/seminaires.json"
        fields:
          - { name: entries, label: "Séminaires", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
              { name: time, label: "Heure", widget: string, default: "14h00", hint: "Ex. 14h00 — modifiable si l'horaire change exceptionnellement" },
              { name: title, label: "Titre de l'exposé", widget: string },
              { name: speaker, label: "Intervenant·e", widget: string },
              { name: abstract, label: "Résumé", widget: text },
              { name: room, label: "Salle", widget: string, required: false },
            ]}

  - name: "stats"
    label: "Quelques chiffres"
    files:
      - name: "entries"
        label: "Chiffres"
        file: "content/stats.json"
        fields:
          - { name: entries, label: "Chiffres", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: label, label: "Légende affichée", widget: string },
              { name: source, label: "Calcul automatique", widget: select, options: [
                  { label: "Total membres de l'équipe", value: "team_total" },
                  { label: "Membres dont le rôle contient un mot-clé", value: "team_keyword" },
                  { label: "Total publications", value: "pub_total" },
                  { label: "Total séminaires programmés", value: "seminar_total" },
                  { label: "Projets en cours", value: "project_active" },
                  { label: "Nombre saisi manuellement", value: "manual" },
                ]},
              { name: keyword, label: "Mot-clé (uniquement si \"Membres dont le rôle contient un mot-clé\")", widget: string, required: false, hint: "Ex. doctorant, ingénieur, postdoc — la casse n'a pas d'importance" },
              { name: manual_number, label: "Nombre (uniquement si \"Nombre saisi manuellement\")", widget: string, required: false },
            ]}

  - name: "banner"
    label: "Accueil — Bannière"
    files:
      - name: "entries"
        label: "Bannière"
        file: "content/banner.json"
        fields:
          - { name: line1, label: "Petit texte du haut", widget: string }
          - { name: line2, label: "Grand texte (nom de l'équipe)", widget: text }
          - { name: line3, label: "Petit texte du bas", widget: string }

  - name: "hero"
    label: "Accueil — Titre principal"
    files:
      - name: "entries"
        label: "Titre principal"
        file: "content/hero.json"
        fields:
          - { name: eyebrow, label: "Petit texte au-dessus du titre", widget: string }
          - { name: title, label: "Titre principal", widget: text }
          - { name: lede, label: "Paragraphe d'introduction", widget: text }

  - name: "mission"
    label: "Notre mission"
    files:
      - name: "entries"
        label: "Objectifs"
        file: "content/mission.json"
        fields:
          - { name: entries, label: "Objectifs", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: title, label: "Titre de l'objectif", widget: string },
              { name: description, label: "Description", widget: text },
            ]}

  - name: "partners"
    label: "Partenaires & financements"
    files:
      - name: "entries"
        label: "Partenaires"
        file: "content/partners.json"
        fields:
          - { name: entries, label: "Partenaires", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: name, label: "Nom du partenaire", widget: string },
              { name: url, label: "Site web (optionnel)", widget: string, required: false },
              { name: logo, label: "Logo (optionnel)", widget: file, required: false, media_folder: "/images/partners", public_folder: "/images/partners", hint: "Image du logo, idéalement sur fond transparent ou blanc" },
            ]}

  - name: "focus"
    label: "Focus (raccourcis accueil)"
    files:
      - name: "entries"
        label: "Raccourcis"
        file: "content/focus.json"
        fields:
          - { name: entries, label: "Raccourcis", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: title, label: "Titre", widget: string },
              { name: description, label: "Description", widget: text },
              { name: link, label: "Lien (ex. publications.html)", widget: string },
            ]}

  - name: "theses"
    label: "Thèses"
    files:
      - name: "entries"
        label: "Thèses"
        file: "content/theses.json"
        fields:
          - { name: entries, label: "Thèses", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: title, label: "Sujet de la thèse", widget: string },
              { name: author, label: "Doctorant·e", widget: string },
              { name: director, label: "Directeur·rice de thèse", widget: string },
              { name: year, label: "Année (ou \"en cours\", \"prévue 2027\"...)", widget: string },
              { name: status, label: "Statut", widget: select, options: ["soutenue", "en_cours"] },
              { name: link, label: "PDF (optionnel)", widget: file, required: false, media_folder: "/files", public_folder: "/files" },
            ]}

  - name: "memoires"
    label: "Mémoires"
    files:
      - name: "entries"
        label: "Mémoires"
        file: "content/memoires.json"
        fields:
          - { name: entries, label: "Mémoires", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: title, label: "Sujet du mémoire", widget: string },
              { name: author, label: "Étudiant·e", widget: string },
              { name: director, label: "Encadrant·e", widget: string },
              { name: year, label: "Année (ou \"en cours\"...)", widget: string },
              { name: status, label: "Statut", widget: select, options: ["encadre", "en_cours"] },
              { name: link, label: "PDF (optionnel)", widget: file, required: false, media_folder: "/files", public_folder: "/files" },
            ]}

  - name: "posts"
    label: "Actualités"
    files:
      - name: "entries"
        label: "Actualités"
        file: "content/posts.json"
        fields:
          - { name: entries, label: "Actualités", widget: list, fields: [
              { name: id, label: "Identifiant (unique)", widget: string },
              { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
              { name: title, label: "Titre", widget: string },
              { name: excerpt, label: "Résumé court", widget: text },
              { name: body, label: "Texte complet", widget: text },
              { name: author, label: "Auteur", widget: string },
            ]}
